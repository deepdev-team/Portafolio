# ---------------------------------------------------------------------------
# Cabeceras y bloqueos de seguridad para portafolio.deepdev.com.co
#
# Este archivo NO se aplica solo: hay que incluirlo en el server block de nginx
# y recargar. Va versionado aqui para que la configuracion del servidor deje de
# vivir solo en la maquina.
#
#   server {
#       server_name portafolio.deepdev.com.co;
#       root /var/www/portafolio;
#       include /var/www/portafolio/deploy/nginx-security.conf;
#       ...
#   }
#
# Despues de incluirlo:  nginx -t && systemctl reload nginx
# ---------------------------------------------------------------------------


# --- 1. Nunca servir el directorio .git ni archivos de configuracion ocultos
#
# El despliegue es un `git pull` en el docroot, asi que .git vive dentro de la
# raiz publica y el servidor no debe exponerlo por ningun motivo. La solucion de
# fondo es desplegar con
#   git --work-tree=/var/www/portafolio --git-dir=/ruta/fuera/del/webroot checkout
# o con rsync, para que .git ni siquiera viva dentro del docroot.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# --- 2. Notas internas fuera del sitio publico
location ^~ /docs/ {
    deny all;
    return 404;
}

# --- 3. Que una ruta inexistente devuelva 404 y no el index completo
#
# Sin esto, cualquier ruta responde 200 con el index entero: contenido duplicado
# para los buscadores y ruido en cualquier auditoria.
location / {
    try_files $uri $uri/ =404;
}


# --- 4. Cabeceras de seguridad
#
# La CSP esta atada a lo que el sitio usa de verdad, comprobado recurso por
# recurso. Si se anade una dependencia nueva, hay que actualizarla aqui.
#
#   script-src  cdnjs           -> jsPDF (index.html)
#   style-src   cdnjs, jsdelivr -> Font Awesome y devicon
#   font-src    los mismos dos  -> las webfonts se resuelven relativas a ese CSS;
#                                  si se omite, se caen todos los iconos
#   img-src     data:           -> favicon SVG de portafolio2 y SVG en styles.css
#   connect-src deepdev.com.co  -> el chat
#               fonts.gstatic   -> Roboto para el PDF del CV; sin esto el CV
#                                  pierde tildes y ene
#
# 'unsafe-inline' en script-src sigue siendo necesario porque index.html tiene
# 64 atributos onclick. Quitarlo exige moverlos a addEventListener antes.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://deepdev.com.co https://fonts.gstatic.com; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# frame-ancestors no funciona en <meta>, solo como cabecera. Este es el que
# impide que el sitio se enmarque (clickjacking).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

# OJO con HSTS: includeSubDomains cubre todos los *.deepdev.com.co (vigilia,
# citaria, edugestion, inventarios, tienda, admin-deepview...). Confirmar que
# TODOS sirven HTTPS antes de activarlo. No anadir 'preload': es practicamente
# irreversible.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
